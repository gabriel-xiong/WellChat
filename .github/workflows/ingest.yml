name: Incremental website ingestion

on:
  schedule:
    - cron: "0 12 * * *" # Daily at 12:00 UTC; only due and changed pages are embedded.
  workflow_dispatch:
    inputs:
      force_check:
        description: "Fetch every eligible page, while still skipping unchanged embeddings"
        required: false
        default: false
        type: boolean
      force_embed:
        description: "Re-embed every eligible page (maintenance/emergency use only)"
        required: false
        default: false
        type: boolean

concurrency:
  group: production-ingestion
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ingestion unit tests
        run: npm test

      - name: Run incremental ingestion
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BASE_SITE_URL: https://thewellaustin.com
          FORCE_CHECK: ${{ inputs.force_check || 'false' }}
          FORCE_EMBED: ${{ inputs.force_embed || 'false' }}
        run: |
          args=()
          if [ "$FORCE_CHECK" = "true" ]; then args+=(--force-check); fi
          if [ "$FORCE_EMBED" = "true" ]; then args+=(--force-embed); fi
          npx tsx scripts/ingest.ts "${args[@]}"

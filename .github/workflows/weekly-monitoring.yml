name: Weekly monitoring report

on:
  schedule:
    # GitHub cron is UTC. Running at both possible offsets lets the gate below
    # select 8:00 AM America/Chicago across daylight-saving changes.
    - cron: "0 13,14 * * 1"
  workflow_dispatch:

concurrency:
  group: weekly-monitoring-report
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check Austin schedule
        id: schedule
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "$(TZ=America/Chicago date +%u-%H)" == "1-08" ]]; then
            echo "run_report=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_report=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.schedule.outputs.run_report == 'true'

      - uses: actions/setup-node@v4
        if: steps.schedule.outputs.run_report == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.schedule.outputs.run_report == 'true'
        run: npm ci

      - name: Generate weekly GitHub Issue
        if: steps.schedule.outputs.run_report == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: npx tsx scripts/send-weekly-monitoring-report.ts
